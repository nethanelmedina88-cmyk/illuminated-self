 illusion of control. I allow life to unfold at its own gentle rhythm, and I magnetize opportunities for action toward me — in the right place, at the right time.`,quotes:[{text:`The only way to make sense of change is to plunge into it, move with it, and join the dance.`,by:`Alan Watts`}],icon:`waves`},{he:`אחריות`,en:`Accountability`,essence:`I choose my fate. All the responsibility — and all the power — is mine.`,body:`I choose my destiny. All of the responsibility is mine, and all of the power rests in my hands.`,quotes:[{text:`The confidence I built didn't come from a perfect family or God-given talent. It came from personal accountability, which brought me self-respect — and self-respect will always light a way forward.`,by:`David Goggins`}],icon:`compass`},{he:`הומור`,en:`Humor`,essence:`Life is not that serious.`,body:`I laugh hard and often through the day — laughter that carries a liberating truth, not a rehearsed joke. Life is not that serious, and I love to play and simply live in good spirits.`,quotes:[{text:`People rarely succeed unless they have fun in what they are doing.`,by:`Dale Carnegie`}],icon:`smile`},{he:`חריצות`,en:`Diligence`,essence:`Steady, earnest, energetic effort.`,body:`Steady, earnest, energetic effort; devoted, meticulous work, and full engagement in the doing.`,quotes:[{text:`The depth of a person's involvement in a deed is the depth of that deed's meaning in their eyes.`,by:`Yigal Allon`}],icon:`hammer`},{he:`חסד`,en:`Kindness`,essence:`A life of giving, with nothing asked in return.`,body:`I carry gratitude for what God has given me as a gift, and for how much others have done for me. I am glad to live in a posture of giving at every opportunity, and I cherish the privilege of giving with nothing asked in return. I am happiest being the one who brings good to my friends and multiplies good in the world.`,quotes:[{text:`A life of blessing is led by kindness.`,by:`Proverb`}],icon:`gift`}],Re=[{he:`שחרית`,en:`Shacharit`,sub:`Consciou
